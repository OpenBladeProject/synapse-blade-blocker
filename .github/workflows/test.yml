name: Tests
on: [push, pull_request]
jobs:
  policy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Use a non-UTC timezone for timestamp regression coverage
        run: tzutil /s "Pacific Standard Time"
      - name: Scratch operations in Windows PowerShell 5.1
        shell: powershell
        run: .\operations.test.ps1
      - name: Scratch operations in PowerShell 7
        shell: pwsh
        run: .\operations.test.ps1
      - name: Desktop regression checks in Windows PowerShell 5.1
        shell: powershell
        run: .\desktop.test.ps1
      - name: Desktop regression checks in PowerShell 7
        shell: pwsh
        run: .\desktop.test.ps1
      - name: Native process regression checks in Windows PowerShell 5.1
        shell: powershell
        run: .\native-process.test.ps1
      - name: Native process regression checks in PowerShell 7
        shell: pwsh
        run: .\native-process.test.ps1
      - shell: pwsh
        run: |
          Get-ChildItem *.ps1 | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
